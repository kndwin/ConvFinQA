[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ag-ui-protocol>=0.1.19",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "dishka>=1.10.1",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.5",
    "logfire[fastapi,sqlalchemy]>=4.40.0",
    "openai-agents>=0.20.0",
    "openai>=2.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "scalar-fastapi>=1.8.2",
    "sqlmodel>=0.0.39",
]

[dependency-groups]
dev = [
    "import-linter>=2.13",
    "ruff>=0.16.3",
    "ty>=0.0.71",
]
eval = [
    "deepeval>=4.1.8,<5",
    "httpx>=0.28.1",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]
extend-exclude = ["src/platform/database/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.14"
root = ["."]

[tool.importlinter]
root_package = "src"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Platform does not depend on modules"
type = "forbidden"
source_modules = [
    "src.platform.database",
    "src.platform.observability",
    "src.platform.repository",
    "src.platform.service",
]
forbidden_modules = ["src.module"]

[[tool.importlinter.contracts]]
name = "Dataset conversation module layers"
type = "layers"
containers = ["src.module.dataset_conversations"]
layers = [
    "dataset_conversations_router",
    "dataset_conversations_service",
    "dataset_conversations_service_schema",
    "dataset_conversations_repository",
    "dataset_conversations_router_schema",
    "dataset_conversations_repository_schema",
    "dataset_conversations_constants",
]

[[tool.importlinter.contracts]]
name = "Agent execution does not depend on application adapters"
type = "forbidden"
source_modules = ["src.module.agent_execution"]
forbidden_modules = [
    "src.module.chat_sessions",
    "src.module.dataset_conversations",
    "src.platform.database",
]
