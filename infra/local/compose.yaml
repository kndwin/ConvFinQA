name: openai-deploy-co

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: convfinqa
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - convfinqa-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d convfinqa"]
      interval: 5s
      timeout: 5s
      retries: 10

  duckdb-otel:
    image: ghcr.io/smithclay/duckdb-otlp:latest
    environment:
      DUCKDB_MODE: local-ducklake
      DUCKLAKE_NAME: lake
      DUCKDB_OTLP_TOKEN: dev-otlp-token-123456
      DUCKDB_QUACK_ENABLED: "1"
      DUCKDB_QUACK_ADDR: 0.0.0.0:9494
      DUCKDB_QUACK_TOKEN: dev-quack-token-123456
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:9494:9494"
    volumes:
      - duckdb-otel-data:/data

  temporal:
    image: temporalio/temporal:1.5.1
    command:
      [
        "server",
        "start-dev",
        "--ip",
        "0.0.0.0",
        "--db-filename",
        "/home/temporal/temporal.db",
      ]
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    volumes:
      - temporal-data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  convfinqa-postgres:
  duckdb-otel-data:
  temporal-data:
